<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECIDER ARENA — a 4B model plays, probabilities exposed</title>
<style>
:root{
  --bg:#07090c; --panel:#0e1319; --line:#1e2a38; --cyan:#35d0e0; --cyan-dim:#16606a;
  --amber:#ffb000; --red:#ff4d5e; --green:#2bd47e; --text:#d7e3ee; --muted:#7187a0; --felt:#0d3b2e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--cyan)}
.top{border-bottom:1px solid var(--line);padding:18px 22px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline}
h1{font-size:22px;letter-spacing:6px;color:var(--cyan);font-weight:600}
h1 span{color:var(--amber)}
.sub{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.badge{border:1px solid var(--cyan-dim);color:var(--cyan);font-size:10px;letter-spacing:1px;padding:3px 8px;text-transform:uppercase}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-right:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;letter-spacing:2px;padding:14px 26px;cursor:pointer;text-transform:uppercase}
.tab.on{color:var(--amber);background:var(--panel)}
.wrap{padding:26px 22px 60px;max-width:1080px;margin:0 auto}
.cards-table{background:var(--felt);border:1px solid var(--line);padding:26px;min-height:200px}
.row-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:10px 0 8px}
.cards{display:flex;gap:8px;flex-wrap:wrap;min-height:74px}
.card{width:52px;height:72px;background:#f4f1e8;color:#151a20;border:2px solid #0a0d11;display:flex;flex-direction:column;justify-content:space-between;padding:6px;font-size:18px;font-weight:700;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.card.red{color:#c0202f}
.card.back{background:repeating-linear-gradient(45deg,#123,#123 4px,#1e3a52 4px,#1e3a52 8px)}
.card small{font-size:11px;font-weight:400}
.move-panel{margin-top:18px;border:1px solid var(--line);background:var(--panel);padding:16px 18px}
.move-state{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:12px}
.opt{margin:8px 0}
.opt-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:12px;border:1px solid var(--line);position:relative;background:var(--bg)}
.fill{position:absolute;inset:1px auto 1px 1px;background:var(--cyan-dim);transition:width .5s ease}
.picked .fill{background:var(--cyan)}
.picked .opt-name{color:var(--cyan)}
.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--cyan-dim);color:var(--cyan);font-family:inherit;font-size:12px;letter-spacing:1.5px;padding:9px 18px;cursor:pointer;text-transform:uppercase}
.btn:hover{border-color:var(--cyan)}
.btn.on{background:var(--cyan);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);background:var(--panel);padding:12px 14px}
.stat b{display:block;font-size:22px;color:var(--amber);font-weight:600}
.stat span{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.verdict{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
.verdict b{color:var(--text)}
/* cliff grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:760px;margin:16px 0}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cell.cliff{background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.4);color:var(--red)}
.cell.pathcell{background:rgba(53,208,224,.15);border-color:var(--cyan-dim)}
.cell.agent{background:var(--cyan);color:var(--bg);font-weight:700}
.cell.goal{border-color:var(--green);color:var(--green)}
.cell.start{border-color:var(--amber);color:var(--amber)}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:11px;color:var(--muted);line-height:1.9}
.warn{color:var(--red)}
.hidden{display:none}
.handlist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.handlink{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:inherit;font-size:11px;padding:5px 9px;cursor:pointer}
.handlink.on{border-color:var(--amber);color:var(--amber)}
.result-win{color:var(--green)} .result-loss{color:var(--red)} .result-push{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <h1>DECIDER <span>ARENA</span></h1>
  <span class="sub">a 4B open model plays games &mdash; every move shows its calibrated probabilities</span>
  <span class="badge">decider-4b v2 &middot; JevBench v1.4.2 #1</span>
</header>
<div class="tabs">
  <button class="tab on" data-g="bj">Blackjack</button>
  <button class="tab" data-g="cliff">CliffWalking</button>
</div>

<div class="wrap" id="bjwrap">
  <div class="stats" id="bjstats"></div>
  <div class="handlist" id="handlist"></div>
  <div class="cards-table">
    <div class="row-label">dealer</div>
    <div class="cards" id="dealer"></div>
    <div class="row-label">you (the model)</div>
    <div class="cards" id="player"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev">&larr; step</button>
    <button class="btn" id="play">play</button>
    <button class="btn" id="next">step &rarr;</button>
  </div>
  <div class="move-panel" id="movepanel"></div>
  <div class="verdict" id="bjverdict"></div>
  <div class="foot" id="bjfoot"></div>
</div>

<div class="wrap hidden" id="cliffwrap">
  <div class="stats" id="cliffstats"></div>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button class="btn" id="cprev">&larr; step</button>
    <button class="btn" id="cplay">play</button>
    <button class="btn" id="cnext">step &rarr;</button>
    <button class="btn" id="ceps"></button>
  </div>
  <div class="move-panel" id="cmovepanel"></div>
  <div class="foot" id="clifffoot"></div>
</div>

<script>
const BJ = JSON.parse(document.getElementById('bjdata').textContent);
const CLIFF = JSON.parse(document.getElementById('cliffdata').textContent);
const META = {
 "model": "Mapika/decider-4b",
 "revision": "v2",
 "model_license": "Apache-2.0",
 "serving": "bundled decider-ai inference subset at v2, plain state-first layout, one forward pass per question",
 "temperatures": {
  "choice": 1.935,
  "noul": 1.935,
  "score": 1.935
 },
 "temperatures_note": "v2 serves one fitted temperature (1.935) for all answer types; the per-type map arrived in v2.1",
 "seed": "none (arena runs were unseeded)",
 "compute": "Kaggle kernel run 352820070, 2x Tesla T4, transformers 5.17.0",
 "generated_utc": "2026-09-25 ~22:30 UTC",
 "note": "Outputs precomputed in one Kaggle run; the sites replay recorded probabilities, no live inference."
};
const $ = s=>document.querySelector(s);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  $('#bjwrap').classList.toggle('hidden',t.dataset.g!=='bj');
  $('#cliffwrap').classList.toggle('hidden',t.dataset.g!=='cliff');
});

/* ---------- BLACKJACK ---------- */
const RANKS={11:'A',10:'10',9:'9',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2'};
let hi=0, mi=0, timer=null;
function cardHTML(v,faceDown){
  if(faceDown) return '<div class="card back"></div>';
  const red = Math.random()<0; // suit unknown; keep all dark for honesty
  return `<div class="card">${RANKS[v]||v}<small>&#9670;</small></div>`;
}
function showHand(){
  const h=BJ.hands[hi];
  const moves=h.moves;
  mi=Math.min(mi,moves.length);
  // player cards revealed progressively: 2 initial + one per hit chosen so far
  let shown=2;
  for(let k=0;k<mi;k++){ if(moves[k].choice==='hit') shown++; }
  shown=Math.min(shown,h.player.length);
  $('#player').innerHTML=h.player.slice(0,shown).map(v=>cardHTML(v)).join('');
  const dealerDone=mi>=moves.length;
  $('#dealer').innerHTML=h.dealer.map((v,i)=>cardHTML(v,!dealerDone&&i===1)).join('');
  let mp;
  if(mi<moves.length){
    const m=moves[mi];
    mp=`<div class="move-state">${m.state.replace(/</g,'&lt;')}</div>`;
    m.options.forEach((o,oi)=>{
      const p=m.probs[oi],pick=o===m.choice;
      mp+=`<div class="opt${pick?' picked':''}"><div class="opt-top">
        <span class="opt-name">${o.toUpperCase()}${pick?' &larr; model picks':''}${o===m.basic_strategy?' (basic strategy)':''}</span>
        <span>${(p*100).toFixed(1)}%</span></div>
        <div class="bar"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div></div>`;
    });
  } else {
    mp=`<div class="move-state">HAND OVER &mdash; player ${h.player_total}, dealer ${h.dealer_total} &rarr;
      <b class="result-${h.result}">${h.result.toUpperCase()}</b></div>`;
  }
  $('#movepanel').innerHTML=mp;
  document.querySelectorAll('.handlink').forEach((b,i)=>b.classList.toggle('on',i===hi));
  const s=BJ.stats;
  $('#bjstats').innerHTML=`
    <div class="stat"><b>${s.win}&ndash;${s.loss}&ndash;${s.push}</b><span>win&ndash;loss&ndash;push / ${BJ.hands_played} hands</span></div>
    <div class="stat"><b>${Math.round(BJ.basic_strategy_agreement*100)}%</b><span>moves matching basic strategy</span></div>
    <div class="stat"><b>${BJ.hands_played}</b><span>hands, greedy argmax play</span></div>`;
  $('#bjverdict').innerHTML=`Honest verdict: the model plays blackjack <b>below basic strategy</b>. Its own model card reports a losing expectation (~&minus;0.6/hand). This is a real 4B decision model doing its best &mdash; calibration, not magic. Watch the hit/stand probabilities: you can see it reason.`;
  $('#handlist').innerHTML=BJ.hands.map((h,i)=>`<button class="handlink${i===hi?' on':''}" data-i="${i}">#${i+1} <span class="result-${h.result}">${h.result[0].toUpperCase()}</span></button>`).join('');
  document.querySelectorAll('.handlink').forEach(b=>b.onclick=()=>{hi=+b.dataset.i;mi=0;showHand()});
}
$('#prev').onclick=()=>{if(mi>0){mi--;showHand()}};
$('#next').onclick=()=>{const h=BJ.hands[hi];if(mi<h.moves.length){mi++;showHand()}else if(hi<BJ.hands.length-1){hi++;mi=0;showHand()}};
$('#play').onclick=e=>{
  if(timer){clearInterval(timer);timer=null;e.target.textContent='play';return}
  e.target.textContent='pause';
  timer=setInterval(()=>{
    const h=BJ.hands[hi];
    if(mi<h.moves.length){mi++;showHand()}
    else if(hi<BJ.hands.length-1){hi++;mi=0;showHand()}
    else{clearInterval(timer);timer=null;$('#play').textContent='play'}
  },1400);
};
$('#bjfoot').innerHTML=footHTML(`Rules: infinite deck, dealer stands on all 17, hit/stand only. Every probability is a real output of decider-4b v2 (revision v2).`);

/* ---------- CLIFF ---------- */
let ep=0, si=0, ctimer=null;
const EPS=[...CLIFF.greedy.map((e,i)=>({...e,label:'greedy'})),...CLIFF.sampled.map((e,i)=>({...e,label:'sampled '+(i+1)}))];
function showCliff(){
  const e=EPS[ep]; si=Math.min(si,e.steps.length);
  const pos=e.steps.length&&si>0?e.steps[si-1]:null;
  // agent position: after si steps
  let agent=[3,0];
  const visited=new Set(['3,0']);
  for(let k=0;k<si;k++){const s=e.steps[k];agent=nextPos(s.pos,s.move);visited.add(agent.join(','))}
  let g='';
  for(let r=0;r<4;r++)for(let c=0;c<12;c++){
    const key=r+','+c;
    let cls='cell';
    if(r===3&&c>=1&&c<=10)cls+=' cliff';
    else if(visited.has(key))cls+=' pathcell';
    if(r===3&&c===0)cls+=' start';
    if(r===3&&c===11)cls+=' goal';
    if(agent[0]===r&&agent[1]===c&&!(r===3&&c===11))cls+=' agent';
    const txt=(r===3&&c===0)?'S':(r===3&&c===11)?'G':(r===3&&c>=1&&c<=10)?'&minus;100':(agent[0]===r&&agent[1]===c?'&#9679;':'');
    g+=`<div class="${cls}">${txt}</div>`;
  }
  $('#grid').innerHTML=g;
  let mp;
  if(si<e.steps.length){
    const s=e.steps[si];
    mp=`<div class="move-state">At row ${s.pos[0]}, col ${s.pos[1]} &mdash; model scores its legal moves:</div>`;
    s.options.forEach((o,oi)=>{
      const p=s.probs[oi],pick=o===s.move;
      mp+=`<div class="opt${pick?' picked':''}"><div class="opt-top"><span class="opt-name">${o.toUpperCase()}${pick?' &larr; model picks':''}</span>
      <span>${(p*100).toFixed(1)}%</span></div><div class="bar"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div></div>`;
    });
  } else {
    mp=`<div class="move-state">EPISODE OVER &mdash; return <b style="color:var(--amber)">${e.return}</b> in ${e.steps_taken} steps &mdash; ${e.success?'<b style="color:var(--green)">REACHED THE GOAL</b>':'did not reach the goal'} (optimal return is &minus;13)</div>`;
  }
  $('#cmovepanel').innerHTML=mp;
  $('#ceps').textContent=`episode: ${e.label} (${ep+1}/${EPS.length})`;
  $('#cliffstats').innerHTML=`
    <div class="stat"><b>${CLIFF.greedy[0].return}</b><span>greedy episode return (optimal &minus;13)</span></div>
    <div class="stat"><b>${CLIFF.greedy[0].steps_taken}</b><span>steps taken, greedy</span></div>
    <div class="stat"><b>${CLIFF.greedy[0].success?'YES':'NO'}</b><span>goal reached, greedy</span></div>`;
}
function nextPos(pos,move){
  let [r,c]=pos;
  if(move==='up')r--; if(move==='down')r++; if(move==='left')c--; if(move==='right')c++;
  if(r===3&&c>=1&&c<=10)return [3,0]; // cliff resets to start
  return [r,c];
}
$('#cprev').onclick=()=>{if(si>0){si--;showCliff()}};
$('#cnext').onclick=()=>{const e=EPS[ep];if(si<e.steps.length){si++;showCliff()}};
$('#cplay').onclick=ev=>{
  if(ctimer){clearInterval(ctimer);ctimer=null;ev.target.textContent='play';return}
  ev.target.textContent='pause';
  ctimer=setInterval(()=>{
    const e=EPS[ep];
    if(si<e.steps.length){si++;showCliff()}
    else{clearInterval(ctimer);ctimer=null;$('#cplay').textContent='play'}
  },500);
};
$('#ceps').onclick=()=>{ep=(ep+1)%EPS.length;si=0;showCliff()};
$('#clifffoot').innerHTML=footHTML(`4&times;12 grid: start S, goal G, the bottom row between them is a cliff (&minus;100 and back to start). The safe path runs along the top. The model sees only a text description of the grid &mdash; no vision, no training on this game.`);

function footHTML(extra){
  return `${extra}<br><br>
  MODEL <a href="https://huggingface.co/Mapika/decider-4b">Mapika/decider-4b</a> revision <b>v2</b> &middot; Apache-2.0 &middot; one forward pass per move, no search, no game tree<br>
  Real trajectories computed on a free Kaggle GPU (${META.generated_utc}), seed ${META.seed}.<br>
  <span class="warn">HONEST NOTE:</span> replays are precomputed, not live. The model card itself reports decider-4b v2 is weak at greedy bag-draw and grid games &mdash; we kept the real numbers rather than cherry-pick wins.`;
}
showHand(); showCliff();
</script>
